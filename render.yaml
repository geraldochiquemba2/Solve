services:
  - type: web
    name: solve-crm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # BD no Supabase (projeto do CRM). Usar o POOLER (porta 6543, transaction
      # mode) — e o suportado para servidores sem IPv6 e evita esgotar conexoes.
      - key: DATABASE_URL
        sync: false
      # O CRM usa uma so base: repetir a mesma URL (o standalone le CRM_DATABASE_URL
      # primeiro). Se um dia separar ginasio/CRM, muda so esta.
      - key: CRM_DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # O pooler do Supabase usa cadeia de certificados self-signed: o driver pg
      # precisa de desligar a verificacao (a ligacao ja e cifrada em TLS).
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Limites de compute (webhook-first, polling raro). Aumentar se a cota apertar.
      - key: EXPIRY_INTERVAL_MS
        value: "1800000"
      - key: AUTOSYNC_INTERVAL_MS
        value: "900000"
      - key: CADEMI_RETRY_INTERVAL_MS
        value: "600000"
      - key: FIT90_SYNC_INTERVAL_MS
        value: "900000"
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: STUDIO_API_KEY
        sync: false
      # FRONTEND_URL e CORS_ORIGIN: intencionalmente ausentes — o backend usa
      # RENDER_EXTERNAL_URL (injectado pelo Render) como fallback, por isso o
      # mesmo render.yaml funciona em qualquer conta sem ajustes.
      - key: EKWANZA_CLIENT_ID
        sync: false
      - key: EKWANZA_CLIENT_SECRET
        sync: false
      - key: EKWANZA_RESOURCE
        sync: false
      - key: EKWANZA_GPO_URL
        sync: false
      - key: EKWANZA_GPO_API_KEY
        sync: false
      - key: EKWANZA_GPR_API_KEY
        sync: false
      - key: EKWANZA_GPO_PAYMENT_METHOD
        sync: false
      - key: EKWANZA_REF_PAYMENT_METHOD
        sync: false
      - key: EKWANZA_ACCOUNT_NUMBER
        sync: false
      - key: WIPAY_CLIENT_ID
        sync: false
      - key: WIPAY_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://fslrkrhuatzfqxbzilnd.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EKWANZA_ACCOUNT
        value: 06100363
      - key: CADEMI_API_URL
        sync: false
      - key: CADEMI_API_KEY
        sync: false
      # WhatsApp Cloud API (Meta). Sem estes valores o health fica
      # "nao_configurado" e nenhum envio é tentado.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_DISPLAY_NAME
        value: SamoraFit
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_LANGUAGE
        value: pt_PT
      - key: AUTOMATION_DRY_RUN
        value: "false"
    healthCheckPath: /healthz
    autoDeploy: true
