          format: uuid
        customerId:
          type: string
          format: uuid
        platform:
          type: string
        status:
          type: string
        ovgAccessId:
          type: string
        cademiAccessId:
          type: string
        activatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AccessInput:
      type: object
      required: [customerId, platform, status]
      properties:
        customerId:
          type: string
          format: uuid
        platform:
          type: string
        status:
          type: string
        ovgAccessId:
          type: string
        cademiAccessId:
          type: string
        activatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Checkin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        location:
          type: string
        ovgCheckinId:
          type: string
        checkedInAt:
          type: string
          format: date-time
    CheckinInput:
      type: object
      required: [customerId]
      properties:
        customerId:
          type: string
          format: uuid
        location:
          type: string
        ovgCheckinId:
          type: string
        checkedInAt:
          type: string
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPreview:
          type: string
        active:
          type: boolean
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApiKeyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
