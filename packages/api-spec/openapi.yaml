  /access:
    get:
      operationId: listAccess
      tags: [access]
      summary: Listar acessos
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: platform
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de acessos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Access"
                  total:
                    type: integer
    post:
      operationId: createAccess
      tags: [access]
      summary: Criar acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessInput"
      responses:
        "201":
          description: Acesso criado
  /access/{id}:
    get:
      operationId: getAccess
      tags: [access]
      summary: Obter acesso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Acesso encontrado
    patch:
      operationId: updateAccess
      tags: [access]
      summary: Atualizar acesso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessInput"
      responses:
        "200":
          description: Acesso atualizado
    delete:
      operationId: deleteAccess
      tags: [access]
      summary: Eliminar acesso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Acesso eliminado
  /checkins:
    get:
      operationId: listCheckins
      tags: [checkins]
      summary: Listar check-ins
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de check-ins
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Checkin"
                  total:
                    type: integer
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Criar check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "201":
          description: Check-in criado
  /checkins/{id}:
    get:
      operationId: getCheckin
      tags: [checkins]
      summary: Obter check-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Check-in encontrado
    delete:
      operationId: deleteCheckin
      tags: [checkins]
      summary: Eliminar check-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Check-in eliminado
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: Listar chaves de API
      responses:
        "200":
          description: Lista de chaves
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
                  total:
                    type: integer
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Criar chave de API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Chave criada
  /api-keys/{id}:
    get:
      operationId: getApiKey
      tags: [api-keys]
      summary: Obter chave de API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chave encontrada
    patch:
      operationId: updateApiKey
      tags: [api-keys]
      summary: Atualizar chave de API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "200":
          description: Chave atualizada
    delete:
      operationId: deleteApiKey
      tags: [api-keys]
      summary: Eliminar chave de API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Chave eliminada
  /api-keys/{id}/toggle:
    patch:
      operationId: toggleApiKey
      tags: [api-keys]
      summary: Ativar/desativar chave de API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chave atualizada
components:
  schemas:
    Access:
      type: object
      properties:
        id:
